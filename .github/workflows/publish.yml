# 打 tag（如 v1.0.0）时自动发布到 npm。
#
# 前置：在 GitHub 仓库的 Settings → Secrets and variables → Actions 里添加
#       NPM_TOKEN（npmjs.com 的 Automation token）。
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # 用于 npm provenance 证明

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 校验包内容
        run: npm pack --dry-run

      - name: 发布到 npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
